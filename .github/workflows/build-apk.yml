name: Build FairLLM APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch pinned llama.cpp source
        run: python scripts/fetch-llama.py

      - name: Build debug APK
        run: gradle :app:assembleDebug testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FairLLM-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

