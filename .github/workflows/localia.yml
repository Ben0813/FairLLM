name: Build and test Localia

on:
  workflow_dispatch:
  pull_request:
    paths: ["localia/**", ".github/workflows/localia.yml"]
  push:
    branches: ["main"]
    paths: ["localia/**", ".github/workflows/localia.yml"]

permissions:
  contents: read

concurrency:
  group: localia-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: localia-debug-key-v1-${{ github.repository_id }}
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Unit tests, lint, APK and unsigned Play bundle
        working-directory: localia
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease --no-daemon
      - name: Verify APK
        working-directory: localia
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          python3 tools/verify_apk.py "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee apk-manifest.txt
          grep -q "package: name='fr.ben0813.localia.debug'" apk-manifest.txt
          grep -q "targetSdkVersion:'36'" apk-manifest.txt
          mkdir -p dist/screens
          cp "$APK" dist/Localia-0.1.0-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/Localia-0.1.0-release-unsigned.aab
          cp README.md PLAY-READINESS.md PRIVACY-POLICY.md dist/
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 device tests and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./localia/gradlew -p localia :app:connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Pictures/Localia-QA/localia-chat.png localia/dist/screens/localia-chat.png
            adb pull /sdcard/Pictures/Localia-QA/localia-connexion.png localia/dist/screens/localia-connexion.png
            adb install -r localia/dist/Localia-0.1.0-debug.apk
            adb shell am start -W -n fr.ben0813.localia.debug/fr.ben0813.localia.MainActivity
            sleep 5
            adb shell pidof fr.ben0813.localia.debug
      - name: Downloadable test build
        uses: actions/upload-artifact@v4
        with:
          name: Localia-Android-test-extraire-le-ZIP
          path: localia/dist/
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Localia-validation
          path: |
            localia/app/build/reports/
            localia/app/build/outputs/androidTest-results/
            localia/apk-manifest.txt
          if-no-files-found: warn
